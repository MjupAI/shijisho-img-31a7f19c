<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>画像の指示書</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#17233d;--sub:#566380;--line:#dde4f2;--brand:#2f6df0;--brand-d:#2456c8;--ok:#16a34a;--warn-bg:#fff7de;--warn:#b7791f;--skip:#8a94ab;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 80px}
header.top{background:linear-gradient(135deg,#2f6df0,#4f8bff);color:#fff;padding:28px 0 56px}
header.top .wrap{padding-bottom:0}
header.top h1{margin:0 0 6px;font-size:28px;letter-spacing:.02em}
header.top p{margin:0;opacity:.92;font-size:15px}
main{margin-top:-34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(30,50,100,.06)}
.stack>*+*{margin-top:18px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:18px;margin:0}
.small{font-size:14px;color:var(--sub)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid3{grid-template-columns:1fr}}
.course{display:block;text-decoration:none;color:inherit;border-top:6px solid var(--c);transition:transform .15s,box-shadow .15s}
.course:hover,.course:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,50,100,.12);outline:none}
.badge{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700}
.course h3{margin:10px 0 6px;font-size:18px;line-height:1.5}
.meta{display:flex;gap:14px;font-size:14px;color:var(--sub);margin-top:8px}
.go{margin-top:14px;font-weight:700;color:var(--brand-d)}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{position:relative;padding-left:30px;margin:8px 0}
ul.check li::before{content:"✓";position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:#e6efff;color:var(--brand-d);font-weight:700;text-align:center;line-height:22px;font-size:14px}
.rules{background:var(--warn-bg);border-left:6px solid #f0b429;border-radius:10px;padding:12px 16px;font-size:15px}
.back[hidden]{display:none}.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#fff;text-decoration:none;font-weight:700;opacity:.95}
nav.chips{position:sticky;top:0;z-index:5;background:rgba(244,247,252,.94);backdrop-filter:blur(6px);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.chips a{flex:none;min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
nav.chips a.done{background:#e8f7ee;border-color:#a7dfbd;color:#116b35}
.bar{height:10px;background:#e3e9f6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.imghead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.pill{background:#e8f0ff;color:var(--brand-d);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:22px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sample{order:-1;position:static!important}}
.sample{position:sticky;top:64px}
.sample img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(15,23,42,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
.sample figcaption{font-size:14px;color:var(--sub);margin-top:8px}
.step{border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 16px;margin-top:14px;background:#fcfdff}
.step.done{background:#f1faf4;border-color:#b6e4c6}
.step header{display:flex;align-items:center;gap:12px}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.step.done .num{background:var(--ok)}
.step h4{margin:0;font-size:18px;flex:1}
label.ok{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;font-size:15px;font-weight:700;cursor:pointer;color:var(--sub)}
label.ok input{width:24px;height:24px;accent-color:var(--ok)}
.body{margin:8px 0 0 48px}
@media(max-width:520px){.body{margin-left:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;text-decoration:none;border:0;font-size:17px;cursor:pointer}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand-d);border:2px solid var(--brand)}
.fill{display:grid;gap:10px;margin-top:6px}
.row{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px}
.row .lab{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.line{display:flex;align-items:center;gap:10px;margin:4px 0}
.line .t{flex:1;font-size:19px;font-weight:800;word-break:break-all}
.copy{flex:none;min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-d);font-weight:800;font-size:14px;cursor:pointer}
.copy.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.enter{font-size:13px;color:var(--sub);margin:0 0 0 4px}
.row.skip{background:#f3f4f8;border-style:dashed}
.row.skip .t{color:var(--skip);font-weight:700;font-size:16px;text-decoration:line-through;text-decoration-color:#b8c0d4}
.row.act{background:var(--warn-bg);border-color:#f3d27a}
.row.act .t{font-size:16px;font-weight:700}
.tag2{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.tag2.s{background:#e3e6ef;color:#5b667f}.tag2.a{background:#fde7a8;color:#7a5200}
.note{font-size:13.5px;color:var(--sub);margin-left:4px}
ol.flow{margin:6px 0 0;padding-left:22px}ol.flow li{margin:6px 0}
.file{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.file code{font-size:17px;font-weight:800;word-break:break-all}
details.tips{margin-top:14px;border:1px solid #f3d27a;background:var(--warn-bg);border-radius:12px;padding:4px 14px}
details.tips summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
details.tips li{margin:8px 0;font-size:15.5px}
.finish{border-top:6px solid var(--ok);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#17233d;color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffb000;outline-offset:2px}
@media(max-width:520px){.step header{flex-wrap:wrap}.step h4{flex:1 1 calc(100% - 52px)}label.ok{margin-left:48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header.top,nav.chips,.toast,.copy{display:none}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
.mapnote{background:#eef4ff;border-left:6px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:15px;margin:6px 0 8px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="back" id="back" href="#/" hidden>← 案件の一覧へ</a><h1>画像の指示書</h1><p>2026年10・11月の案件｜10月分は10月31日まで、11月分は11月30日までに提出</p></div></header>
<main class="wrap" id="app"></main>
<div id="lb" role="dialog" aria-label="完成見本の拡大"><img alt=""></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store={};
try{store=JSON.parse(localStorage.getItem('shijisho-v2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('shijisho-v2',JSON.stringify(store))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1400)};
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return false}}};
const home=()=>`
<div class="stack">
 <section class="card">
  <h2>はじめる前に</h2>
  <ul class="check">
   <li>パソコンのブラウザで作業します（スマホではできません）。</li>
   <li>Canvaに無料登録して、ログインしておきます。</li>
   <li>担当する案件は、職員さんが決めます。決まった案件だけ、上から順に進めます。</li>
   <li>やり方の動画：アプリの教材にある、各画像の「取組動画」と「テンプレートの使い方」を見ます。</li>
   <li>分からない時は、そこで止めて、職員さんかぴくとに聞きます。</li>
  </ul>
  <div class="rules" style="margin-top:14px"><b>守ること</b>　大きさ・色・文字の形を変えない／文を足さない／Canvaの素材・AIボタンを使わない</div>
 </section>
 <section><h2 style="margin:8px 4px 12px">案件をえらぶ</h2>
 <div class="grid3">${COURSES.map(c=>`
  <a class="card course" style="--c:${c.color}" href="#/${c.key}">
   <span class="badge">${c.level}　${c.code}</span>
   <h3>${esc(c.title)}</h3>
   <div class="meta"><span>🖼 画像 ${c.images.length}枚</span><span>⏱ 目安 ${c.time}</span></div>
   <div class="small" id="hp-${c.key}"></div>
   <div class="go">この案件を始める →</div>
  </a>`).join('')}</div></section>
 <section class="card"><h2>1枚ずつ、同じ4つ</h2>
  <ol class="flow"><li><b>型を開いて</b>、コピーを作る</li><li><b>表の文</b>を入れる</li><li><b>書き出す</b>（PNG）</li><li><b>提出する</b></li></ol></section>
</div>`;
const stepKey=(c,i,s)=>`${c.key}.${i}.${s}`;
const prog=c=>{let d=0,t=c.images.length*4;c.images.forEach((_,i)=>{for(let s=1;s<=4;s++)if(store[stepKey(c,i,s)])d++});return[d,t]};
function fillRows(rows){return rows.map(r=>{
 if(r.k==='skip')return`<div class="row skip"><div class="lab">${esc(r.id)}</div><div class="line"><span class="t"><span class="tag2 s">入れない</span>${esc(r.label.replace(/^入れない（?/,'').replace(/）$/,''))}</span></div></div>`;
 if(r.k==='action')return`<div class="row act"><div class="lab">${esc(r.id)}</div><div class="line"><span class="t"><span class="tag2 a">操作</span>${esc(r.label)}</span></div></div>`;
 return`<div class="row"><div class="lab">${esc(r.id)}${r.lines.length>1?'　（2行に分けて入れる）':''}</div>${r.lines.map((l,n)=>`<div class="line"><span class="t">${esc(l)}</span><button class="copy" data-copy="${esc(l)}" aria-label="「${esc(l)}」をコピー">コピー</button></div>`).join('')}${r.lines.length>1?'<div class="enter">1行目を入れたら Enter を押して、2行目を入れます</div>':''}${r.note?`<div class="note">※${esc(r.note)}</div>`:''}</div>`}).join('')}
function stepBlock(c,i,s,title,inner){const k=stepKey(c,i,s),d=!!store[k];return`<section class="step${d?' done':''}" id="s-${c.key}-${i}-${s}"><header><span class="num">${d?'✓':s}</span><h4>${title}</h4><label class="ok"><input type="checkbox" data-k="${k}" ${d?'checked':''}>できた</label></header><div class="body">${inner}</div></section>`}
function imageCard(c,im,i){
 const n=c.images.length;
 return`<article class="card" id="img-${c.key}-${i}">
  <div class="imghead"><span class="pill">画像 ${i+1} / ${n}</span><h2 style="margin:0">${esc(im.name)}</h2><span class="small">${im.size}　${im.kind}</span></div>
  <div class="layout"><div>
   ${stepBlock(c,i,1,'型を開いて、コピーを作る',`<a class="btn" href="${LINKS[im.kind]}" target="_blank" rel="noopener">Canvaで型を開く（${im.kind}）</a><div class="small" style="margin-top:8px">「ファイル」→「コピーを作成」。新しいタブで開いた、題名が「…のコピー」の画面で作業します。</div>`)}
   ${stepBlock(c,i,2,'表の文を入れる',`<div class="mapnote">🗺 <b>枠の場所は「枠IDの地図」で探します。</b>Canvaの型の中の「枠IDの地図」と書いたページ（I3は5〜8ページ目の、作る型と同じ名前の地図）を見ると、下の表の枠IDが、画像のどの場所か分かります。</div><div class="small">文はそのまま入れます。「コピー」を押して貼り付けると、打ち間違えを防げます。「／」の所は、2行に分けて Enter を押します。</div><div class="fill">${fillRows(im.rows)}</div>`)}
   ${stepBlock(c,i,3,'書き出す',`<div class="small">画像の名前</div><div class="file"><code>${im.file}</code><button class="copy" data-copy="${im.file}">コピー</button></div><ol class="flow"><li>左上の題名を、この名前に直す</li><li>「共有」→「ダウンロード」</li><li>ファイルの種類は「PNG」</li><li>「ページを選択」で「このページ」（指定のページだけ。「枠IDの地図」のページは書き出しません）</li><li>「ダウンロード」を押す（始まらない時は、出てきた「こちらをクリック」）</li></ol>`)}
   ${stepBlock(c,i,4,'提出する',`<ol class="flow"><li>アプリの「案件の成果物を提出」を開く</li><li>書き出したPNGを付ける</li>${im.alt?`<li>メモ欄に、次の文を書く（Canvaには入れません）<div class="file"><code style="font-size:15px">${esc(im.alt)}</code><button class="copy" data-copy="${esc(im.alt)}">コピー</button></div></li>`:''}<li>「届きました」と出たら、提出できています</li></ol>`)}
   ${im.tips?`<details class="tips"><summary>うまくいかない時は（${im.tips.length}）</summary><ul>${im.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`:''}
  </div>
  <figure class="sample" style="margin:0"><img src="img/${im.img}" alt="完成見本：${esc(im.name)}"><figcaption>完成見本。これと同じになれば合格です。（押すと大きく見えます）</figcaption></figure></div>
 </article>`}
function course(c){
 return`<div class="stack" style="margin-top:0">
 <section class="card" style="border-top:6px solid ${c.color}">
  <span class="badge" style="--c:${c.color}">${c.level}　${c.code}</span>
  <h2 style="margin:10px 0 4px">${esc(c.title)}</h2>
  <div class="small">画像 ${c.images.length}枚｜目安 ${c.time}｜上から順に、1枚ずつ作ります</div>
  <div style="margin-top:12px"><div class="bar"><i id="bar"></i></div><div class="small" id="barlab" style="margin-top:6px"></div></div>
 </section>
 <nav class="chips" aria-label="画像の一覧">${c.images.map((im,i)=>`<a href="#img-${c.key}-${i}" data-chip="${i}">${i+1}　${esc(im.name)}（${im.kind}）</a>`).join('')}</nav>
 ${c.images.map((im,i)=>imageCard(c,im,i)).join('')}
 <section class="card finish"><h2>ぜんぶ終わったら</h2><p style="margin:6px 0 0">${c.images.length}枚とも「届きました」と出ていれば、完了です。おつかれさまでした。</p><p style="margin:12px 0 0"><a class="btn ghost" href="#/">案件の一覧へ戻る</a></p></section>
 </div>`}
function refresh(c){
 const[d,t]=prog(c);const b=$('#bar');if(b){b.style.width=(d/t*100)+'%';$('#barlab').textContent=`${d} / ${t} 完了`}
 document.querySelectorAll('[data-chip]').forEach(a=>{const i=+a.dataset.chip;let all=true;for(let s=1;s<=4;s++)if(!store[stepKey(c,i,s)])all=false;a.classList.toggle('done',all)});
}
function render(){
 const h=location.hash.replace(/^#\/?/,'');const c=COURSES.find(x=>x.key===h);
 const app=$('#app');$('#back').hidden=!c;
 if(!c){app.innerHTML=home();COURSES.forEach(x=>{const[d,t]=prog(x);const e=$('#hp-'+x.key);if(e&&d)e.textContent=`進み具合：${d} / ${t}`});scrollTo(0,0);document.title='画像の指示書';return}
 app.innerHTML=course(c);document.title=`${c.level} ${c.code}｜画像の指示書`;refresh(c);scrollTo(0,0);
 app.querySelectorAll('input[data-k]').forEach(el=>el.addEventListener('change',()=>{store[el.dataset.k]=el.checked?1:0;save();const sec=el.closest('.step');sec.classList.toggle('done',el.checked);$('.num',sec).textContent=el.checked?'✓':sec.id.split('-').pop();refresh(c)}));
}
document.addEventListener('click',async e=>{const si=e.target.closest('.sample img');if(si){const lb=$('#lb');$('img',lb).src=si.src;$('img',lb).alt=si.alt;lb.classList.add('on');return}if(e.target.closest('#lb')){$('#lb').classList.remove('on');return}const b=e.target.closest('.copy');if(!b)return;const ok=await copyText(b.dataset.copy);if(ok){b.classList.add('ok');b.textContent='コピーした';toast('コピーしました');setTimeout(()=>{b.classList.remove('ok');b.textContent='コピー'},1400)}else toast('コピーできませんでした。文を選んで、手でコピーしてください')});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
addEventListener('hashchange',()=>{if(/^#img-/.test(location.hash))return;render()});
render();
</script>
</body></html>
